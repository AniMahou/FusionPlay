<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AniMahou</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/tokens.css" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body data-screen="home">
  <div class="bg" id="bg" aria-hidden="true">
    <div class="scene-host" id="scene-host"></div>
    <div class="bg-img" id="bg-img"></div>
    <video class="bg-video" id="bg-video" muted loop playsinline preload="none"></video>
    <div class="bg-veil"></div>
  </div>
  <header class="hud">
    <a href="#/" class="hud-brand"><svg class="i"><use href="#i-star"/></svg><span>AniMahou</span></a>
    <div class="hud-right">
      <span class="now-playing" id="now-playing" hidden></span>
      <span class="clock" id="clock"></span>
      <button class="hud-btn" id="btn-board" aria-label="Today's leaderboard"><svg class="i"><use href="#i-trophy"/></svg></button>
      <button class="hud-btn" id="btn-music" aria-label="Turn music off" aria-pressed="true"><svg class="i"><use href="#i-note"/></svg></button>
      <button class="hud-btn" id="btn-full" aria-label="Full screen"><svg class="i"><use href="#i-expand"/></svg></button>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <div class="overlay" id="overlay" hidden></div>
  <audio id="bgm" loop preload="none"></audio>

  <!-- Original icon set, drawn in the style of game menu glyphs -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></symbol>
    <symbol id="i-wish" viewBox="0 0 24 24"><path d="M12 3l1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8z"/><path d="M19 2l.7 2.3L22 5l-2.3.7L19 8l-.7-2.3L16 5l2.3-.7zM5 16l.6 1.9 1.9.6-1.9.6L5 21l-.6-1.9-1.9-.6 1.9-.6z"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a10 10 0 1 1 0 20 10 10 0 0 1 0-20zm0 2a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></symbol>
    <symbol id="i-scroll" viewBox="0 0 24 24"><path d="M6 3h11a3 3 0 0 1 0 6h-1v10a2 2 0 0 1-2 2H5a3 3 0 0 1 0-6h1zm2 2v10h6V7h3a1 1 0 0 0 0-2zm-3 12a1 1 0 0 0 0 2h7.2a3 3 0 0 1-.2-1 3 3 0 0 1 .2-1z"/></symbol>
    <symbol id="i-gem" viewBox="0 0 24 24"><path d="M7 3h10l5 6-10 12L2 9zm1.2 2L5 9h3.6l2-4zm7.6 0h-2.4l2 4H19zM12 6.2L10.9 9h2.2zM5.6 11l5.2 6.2L9 11zm7.6 6.2l5.2-6.2H15z"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M6 3h12v2h3v3a4 4 0 0 1-4 4h-.3A6 6 0 0 1 13 15.9V18h3v3H8v-3h3v-2.1A6 6 0 0 1 7.3 12H7a4 4 0 0 1-4-4V5h3zm-1 4v1a2 2 0 0 0 1.2 1.8A6 6 0 0 1 6 9V7zm13 0v2c0 .3 0 .6-.1.8A2 2 0 0 0 19 8V7z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M9 4l12-2v13.5A3.5 3.5 0 1 1 19 12.3V6.4l-8 1.4v9.7A3.5 3.5 0 1 1 9 14.3z"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M9 4l12-2v13.5A3.5 3.5 0 1 1 19 12.3V6.4l-8 1.4v9.7A3.5 3.5 0 1 1 9 14.3z" opacity=".35"/><path d="M3 3l18 18-1.4 1.4L1.6 4.4z"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3zm11 0h7v7h-2V5h-5zM3 14h2v5h5v2H3zm16 0h2v7h-7v-2h5z"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M10 5l1.4 1.4L6.8 11H21v2H6.8l4.6 4.6L10 19l-7-7z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M5.6 4.2L12 10.6l6.4-6.4 1.4 1.4-6.4 6.4 6.4 6.4-1.4 1.4-6.4-6.4-6.4 6.4-1.4-1.4 6.4-6.4-6.4-6.4z"/></symbol>
  </svg>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
